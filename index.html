<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gungsuju</title>
  <meta name="description" content="Situs pribadi Gungsuju: proyek, skill, dan tautan." />
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Atur tema sebelum render supaya tidak berkedip -->
  <script>
    try {
      var t = localStorage.getItem("theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>

  <!-- Daftar library (tanpa build). Ubah versi di sini jika perlu. -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
      "htm": "https://esm.sh/htm@3.1.1",
      "@radix-ui/react-dialog": "https://esm.sh/@radix-ui/react-dialog@1.1.2?external=react,react-dom",
      "@radix-ui/react-tabs": "https://esm.sh/@radix-ui/react-tabs@1.1.1?external=react,react-dom",
      "@radix-ui/react-accordion": "https://esm.sh/@radix-ui/react-accordion@1.2.1?external=react,react-dom",
      "@radix-ui/react-switch": "https://esm.sh/@radix-ui/react-switch@1.1.1?external=react,react-dom",
      "@radix-ui/react-tooltip": "https://esm.sh/@radix-ui/react-tooltip@1.1.3?external=react,react-dom"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>Halaman ini membutuhkan JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
