<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gungsuju</title>
  <meta name="description" content="Situs pribadi Gungsuju: proyek, skill, dan tautan." />

  <!-- Atur tema sebelum render supaya tidak berkedip -->
  <script>
    try {
      var t = localStorage.getItem("theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.classList.toggle("dark", t === "dark");
    } catch (e) {}
  </script>

  <!-- Tailwind CSS (Play CDN, tanpa build) -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: { accent: "rgb(var(--accent) / <alpha-value>)" },
          keyframes: {
            fade: { from: { opacity: "0" }, to: { opacity: "1" } },
            pop: {
              from: { opacity: "0", transform: "translate(-50%, -48%) scale(0.97)" },
              to: { opacity: "1", transform: "translate(-50%, -50%) scale(1)" },
            },
            slide: {
              from: { opacity: "0", transform: "translateY(-4px)" },
              to: { opacity: "1", transform: "translateY(0)" },
            },
          },
          animation: {
            fade: "fade 0.15s ease-out",
            pop: "pop 0.18s ease-out",
            slide: "slide 0.2s ease-out",
          },
        },
      },
    };
  </script>
  <!-- Warna aksen: ganti angka RGB di sini (terang / gelap) -->
  <style>
    :root { --accent: 79 70 229; }
    .dark { --accent: 129 140 248; }
    html { scroll-behavior: smooth; }
  </style>

  <!-- Daftar library JS (tanpa build). Ubah versi di sini jika perlu. -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
      "htm": "https://esm.sh/htm@3.1.1",
      "@radix-ui/react-dialog": "https://esm.sh/@radix-ui/react-dialog@1.1.2?external=react,react-dom",
      "@radix-ui/react-tabs": "https://esm.sh/@radix-ui/react-tabs@1.1.1?external=react,react-dom",
      "@radix-ui/react-accordion": "https://esm.sh/@radix-ui/react-accordion@1.2.1?external=react,react-dom",
      "@radix-ui/react-switch": "https://esm.sh/@radix-ui/react-switch@1.1.1?external=react,react-dom",
      "@radix-ui/react-tooltip": "https://esm.sh/@radix-ui/react-tooltip@1.1.3?external=react,react-dom"
    }
  }
  </script>
</head>
<body class="bg-stone-50 font-sans leading-relaxed text-stone-900 antialiased dark:bg-stone-950 dark:text-stone-100">
  <div id="root"></div>
  <noscript>Halaman ini membutuhkan JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
